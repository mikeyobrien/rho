<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#16181c">
<meta name="referrer" content="no-referrer">
<title>rho</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
	<div class="title">
		<h1>rho</h1>
		<p id="status" role="status" aria-live="polite">Connecting</p>
	</div>
	<button id="menu-button" class="icon" aria-label="Menu" aria-haspopup="true" aria-expanded="false">⋯</button>
	<div id="menu" class="menu" hidden>
		<label for="model">Model</label>
		<select id="model"></select>
		<label for="thinking">Thinking</label>
		<select id="thinking"></select>
		<button id="new-chat">Clear context</button>
		<button id="show-workers" hidden></button>
		<p class="menu-label">Conversations</p>
		<ul id="conversations"></ul>
		<button id="new-conversation">New conversation</button>
	</div>
</header>

<main id="thread" role="log" aria-label="Conversation" tabindex="0">
	<button id="earlier" class="quiet" hidden>Show earlier messages</button>
	<div id="entries"></div>
	<div id="live"></div>
	<div id="empty" hidden>
		<p class="empty-title">No messages yet</p>
		<p>Write a message to start.</p>
	</div>
</main>

<button id="latest" class="latest" hidden>Latest</button>

<section id="workers" class="workers" aria-label="Workers" hidden>
	<p id="worker-thread" class="worker-thread" hidden></p>
</section>

<section id="release" class="release" role="status" aria-live="polite" hidden>
	<p id="release-text"></p>
</section>

<section id="notice" class="notice" hidden>
	<p id="notice-text">Can't reach rho.</p>
</section>

<footer>
	<ul id="queue" aria-label="Waiting messages"></ul>
	<ul id="photos" aria-label="Photos to send"></ul>
	<form id="composer">
		<button id="attach" type="button" class="icon" aria-label="Add a photo">+</button>
		<input id="photo-input" type="file" accept="image/*" multiple hidden>
		<textarea id="input" rows="1" placeholder="Message" aria-label="Message" enterkeyhint="enter"></textarea>
		<button id="send" type="submit" aria-label="Send">Send</button>
	</form>
</footer>

<script type="module" src="/main.js"></script>
</body>
</html>
